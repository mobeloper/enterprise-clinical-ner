version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - echo Installing test dependencies...
      # Install testing requirements early to validate the raw codebase
      - pip install -r requirements.txt pytest httpx

  pre_build:
    commands:
      - echo Running unit and integration tests via pytest...
      # Execute test suite. CodeBuild aborts execution if this returns a non-zero exit code
      - pytest tests/ --maxfail=1 --disable-warnings
      
      - echo Tests passed successfully. Proceeding to Amazon ECR authentication...
      - aws --version
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $REPOSITORY_URI
      - COMMIT_HASH=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      - IMAGE_TAG=${COMMIT_HASH:-latest}
      
  build:
    commands:
      - echo Build started on `date`
      - echo Building the production Docker image...
      # Build utilizing internal engine caching optimizations
      - docker build --cache-from $REPOSITORY_URI:latest -t $REPOSITORY_URI:latest .
      - docker tag $REPOSITORY_URI:latest $REPOSITORY_URI:$IMAGE_TAG
  post_build:
    commands:
      - echo Build completed on `date`
      - echo Pushing the Docker images to ECR...
      # Push both the unique commit tag and update the latest structural pointer tag
      - docker push $REPOSITORY_URI:latest
      - docker push $REPOSITORY_URI:$IMAGE_TAG
      - echo Writing image definitions file for downstream deployment deployment steps...
      - printf '[{"name":"clinical-ner-gateway","imageUri":"%s"}]' $REPOSITORY_URI:$IMAGE_TAG > imagedefinitions.json

artifacts:
  files: 
    - imagedefinitions.json
    - k8s/*  # Optional: For passing raw manifests down an EKS GitOps path
